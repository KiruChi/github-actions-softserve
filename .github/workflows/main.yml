name: Test Workflow

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest --cov=myapp --cov-fail-under=70 --cov-report=html

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: htmlcov/